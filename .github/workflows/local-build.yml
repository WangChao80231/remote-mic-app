name: Local Build SayAll

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: local-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          swift --version

      - name: Build app (official script, ad-hoc signed, no private packages)
        env:
          SAYALL_DIAGNOSTIC_PUBLIC_KEY_BASE64: SUENDJuMtCsctHQyviQIABElAMLba/54DvrbykCZWyk=
        run: ./scripts/build-app.sh

      - name: Verify app bundle
        run: |
          ls -la dist/SayAll.app/Contents/MacOS/
          plutil -p dist/SayAll.app/Contents/Info.plist | grep -E "ShortVersion|CFBundleVersion"
          codesign -dv dist/SayAll.app 2>&1 | head -5

      - name: Zip app
        run: |
          cd dist
          ditto -c -k --keepParent SayAll.app SayAll.zip
          ls -la SayAll.zip

      - name: Push artifact to build-output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/artifact-repo
          if ! git clone --depth 1 --branch build-output "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/artifact-repo 2>/dev/null; then
            git init -b build-output /tmp/artifact-repo
            cd /tmp/artifact-repo
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          cd /tmp/artifact-repo
          git config user.name "sayall-local-build"
          git config user.email "sayall-local-build@users.noreply.github.com"
          rm -f SayAll.zip version-info.plist
          cp "${GITHUB_WORKSPACE}/dist/SayAll.zip" ./
          cp "${GITHUB_WORKSPACE}/dist/SayAll.app/Contents/Info.plist" ./version-info.plist
          git add SayAll.zip version-info.plist
          git commit -m "SayAll.app build from ${GITHUB_SHA}" || echo "no changes to commit"
          git push origin build-output
